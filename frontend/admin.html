<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | City Hospital</title>
  <link rel="icon" type="image/x-icon" href="pediatrics.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>

<body class="bg-light">

  <header class="navbar">
    <div class="logo">
      <i class="fa-solid fa-heart-pulse"></i>
      Admin<span>Panel</span>
    </div>
    <div class="nav-links">
      <button onclick="logout()" class="btn btn-outline" style="border-color: var(--danger); color: var(--danger);">
        <i class="fa-solid fa-right-from-bracket"></i> Logout
      </button>
    </div>
  </header>

  <div class="container section-padding">
    <div class="dashboard-header" data-aos="fade-down">
      <div>
        <h1>Welcome, Admin</h1>
        <p>Manage patient appointments and hospital records.</p>
      </div>
      <div class="stats-mini">
        <div class="mini-card">
          <span id="totalAppointments">--</span>
          <label>Total Bookings</label>
        </div>
      </div>
    </div>

    <div class="table-card" data-aos="fade-up">
      <div class="card-header">
        <h3><i class="fa-solid fa-list-ul"></i> Recent Appointments</h3>
      </div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Patient Name</th>
              <th>Date</th>
              <th>Reason/Symptoms</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="appointments">
            <!-- Populated by JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="js/home.js"></script>
  <script src="js/admin.js"></script>
</body>

</html>
